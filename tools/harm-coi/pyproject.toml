[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harm-coi"
version = "0.1.0"
description = "Cone-of-influence generator for HARM: reads SystemVerilog RTL, writes coi.json (coi.v1)"
requires-python = ">=3.11"
dependencies = ["pyslang==12.0.0"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
harm-coi = "harm_coi.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
